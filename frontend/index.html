<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />

    <!-- ทำให้หน้าเว็บแสดงผลพอดีกับหน้าจอมือถือ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Movie API</title>

    <!-- โหลดฟอนต์จาก Google Fonts: Prompt (หัวข้อ) และ Sarabun (เนื้อหา) ทั้งคู่รองรับภาษาไทย -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet" />

    <!-- ไฟล์จัดหน้าตาทั้งหมด -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ส่วนหัวของเว็บ -->
    <header class="header">
      <div class="header-inner">
        <h1>Movie API 🎬</h1>
        <p>ระบบจัดการข้อมูลภาพยนตร์</p>
      </div>
    </header>

    <main class="container">
      <!-- แถวบน: ฟอร์ม Login (ซ้าย) กับฟอร์มสมัครสมาชิก (ขวา) -->
      <div class="panels">
        <!-- ===== Login / Logout ===== -->
        <section class="card">
          <h2>เข้าสู่ระบบ</h2>

          <!-- novalidate = ปิดข้อความเตือนของ Browser เพราะ app.js แสดงข้อความภาษาไทยเอง -->
          <form id="loginForm" novalidate>
            <input id="email" type="email" placeholder="Email" aria-label="Email" autocomplete="username" />
            <input id="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" />

            <!-- ตอนเข้าสู่ระบบแล้ว ช่องนี้จะโผล่มาแทนช่องรหัสผ่านเพื่อแสดง Role (ซ่อนอยู่ตอนแรก) -->
            <input id="roleDisplay" type="text" aria-label="สิทธิ์ผู้ใช้" readonly hidden />

            <!-- app.js เปลี่ยนข้อความปุ่มนี้เป็น "ออกจากระบบ" ตอนเข้าสู่ระบบแล้ว -->
            <button type="submit" id="loginButton">เข้าสู่ระบบ</button>
          </form>

          <!-- ข้อความสถานะ: "กรุณาเข้าสู่ระบบ" หรือ "เข้าสู่ระบบแล้ว" -->
          <p id="loginMessage" role="status">กรุณาเข้าสู่ระบบ</p>
        </section>

        <!-- ===== สมัครสมาชิก (สร้างบัญชี role user) ===== -->
        <section class="card">
          <h2>สมัครสมาชิก</h2>

          <form id="registerForm" novalidate>
            <input id="registerEmail" type="email" placeholder="Email" aria-label="Email สำหรับสมัครสมาชิก" autocomplete="off" />
            <input
              id="registerPassword"
              type="password"
              placeholder="Password (อย่างน้อย 6 ตัวอักษร)"
              aria-label="Password สำหรับสมัครสมาชิก"
              autocomplete="new-password"
            />
            <button type="submit" class="secondary">สมัครสมาชิก</button>
          </form>

          <p id="registerMessage" role="status"></p>
        </section>
      </div>

      <!-- ===== ฟอร์มเพิ่ม / แก้ไขภาพยนตร์ ===== -->
      <section class="card movie-form-card">
        <!-- หัวข้อนี้ app.js เปลี่ยนเป็น "แก้ไขภาพยนตร์ ID ..." ตอนกดแก้ไข -->
        <h2 id="formTitle">เพิ่มภาพยนตร์</h2>

        <form id="movieForm" novalidate>
          <input id="movieTitle" type="text" placeholder="ชื่อภาพยนตร์" aria-label="ชื่อภาพยนตร์" />
          <input id="movieDirector" type="text" placeholder="ผู้กำกับ" aria-label="ผู้กำกับ" />
          <input id="movieYear" type="number" placeholder="ปีที่ฉาย" aria-label="ปีที่ฉาย" min="1" />
          <button type="submit">บันทึกภาพยนตร์</button>

          <!-- ซ่อนอยู่ตลอด จะโผล่เฉพาะตอนกำลังแก้ไขหนัง -->
          <button type="button" id="cancelEditButton" class="secondary" hidden>ยกเลิกการแก้ไข</button>
        </form>

        <!-- ข้อความแจ้งผล เช่น "เพิ่มภาพยนตร์สำเร็จ" -->
        <p id="movieFormMessage" role="status"></p>
      </section>

      <!-- ===== แถบค้นหาและเรียงลำดับ ===== -->
      <section class="toolbar">
        <input id="searchInput" type="text" placeholder="ค้นหาชื่อหนังหรือผู้กำกับ..." aria-label="ค้นหา" />

        <!-- เลือกว่าจะเรียงตามอะไร (ค่า value ต้องตรงกับที่ Backend รองรับ) -->
        <select id="sortSelect" aria-label="เรียงตาม">
          <option value="id">เรียงตาม ID</option>
          <option value="title">ชื่อภาพยนตร์</option>
          <option value="director">ชื่อผู้กำกับ</option>
          <option value="release_year">ปีที่ฉายภาพยนตร์</option>
        </select>

        <!-- เรียงจากน้อยไปมาก หรือมากไปน้อย -->
        <select id="orderSelect" aria-label="ลำดับ">
          <option value="asc">น้อย → มาก / A → Z</option>
          <option value="desc">มาก → น้อย / Z → A</option>
        </select>

        <button id="searchButton">ค้นหา</button>
      </section>

      <!-- ข้อความ "กำลังโหลด" (ซ่อนไว้ แสดงเฉพาะตอนรอข้อมูล) -->
      <p id="loading" hidden>กำลังโหลดข้อมูล...</p>

      <!-- ข้อความ Error สีแดง (ว่างไว้ถ้าไม่มีปัญหา) -->
      <p id="errorMessage" role="alert"></p>

      <!-- ===== รายการหนัง: app.js สร้างการ์ดโปสเตอร์ใส่ใน div นี้ ===== -->
      <section>
        <div id="movieList" class="movie-grid"></div>
      </section>

      <!-- ===== ปุ่มเปลี่ยนหน้า ===== -->
      <div class="pagination">
        <button id="previousButton" class="secondary">← ก่อนหน้า</button>
        <span id="pageInfo">หน้า 1</span>
        <button id="nextButton" class="secondary">ถัดไป →</button>
      </div>
    </main>

    <!-- โหลด app.js ท้ายสุด เพื่อให้ element ด้านบนถูกสร้างเสร็จก่อน -->
    <script src="app.js"></script>
  </body>
</html>
